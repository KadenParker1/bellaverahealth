# Active during ./mvnw test. Datasource is supplied per-test via
# @DynamicPropertySource against a Testcontainers Postgres instance.

bellavera.llm.provider=mock
app.cors.allowed-origins=http://localhost:5173

# Never actually called - MockMvc's jwt() post-processor injects the security context directly -
# but the resource server DSL needs a JwtDecoder bean to exist at startup.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.invalid/.well-known/jwks.json
