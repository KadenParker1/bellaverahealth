# Railway / Supabase deployment. Every value comes from an environment variable -
# nothing environment-specific is hardcoded here.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER}
# Supabase's asymmetric signing keys are ES256, not the RS256 Spring assumes by default.
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# mock is the only adapter implemented right now - see com.pm.bellavera.llm.LlmConfig.
bellavera.llm.provider=${BELLAVERA_LLM_PROVIDER:mock}
bellavera.llm.model=${BELLAVERA_LLM_MODEL:}

# Stripe is required here: PaymentConfig refuses the mock gateway under the prod profile.
bellavera.store.payment-provider=${BELLAVERA_STORE_PAYMENT_PROVIDER:stripe}
bellavera.store.currency=${BELLAVERA_STORE_CURRENCY:usd}
bellavera.store.checkout-success-url=${BELLAVERA_STORE_SUCCESS_URL}
bellavera.store.checkout-cancel-url=${BELLAVERA_STORE_CANCEL_URL}
bellavera.store.shipping-countries=${BELLAVERA_STORE_SHIPPING_COUNTRIES:US}
bellavera.store.stripe.secret-key=${STRIPE_SECRET_KEY}
bellavera.store.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# The OpenAPI document lists every route including the admin tree, and Swagger UI is a
# ready-made client for probing them. SecurityConfig also stops permitting these paths under `prod`;
# switching springdoc off as well means there is nothing there to reach even if that changes.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoint.health.show-details=never
