spring.application.name=bellavera

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- OpenAPI ---
springdoc.swagger-ui.path=/docs

# --- Bellavera LLM harness (see com.pm.bellavera.llm.LlmProperties) ---
# provider=mock is the only adapter implemented right now - see com.pm.bellavera.llm.LlmConfig.
bellavera.llm.provider=mock
bellavera.llm.temperature=0.4
bellavera.llm.max-tokens=2048
bellavera.llm.history-turns=10
bellavera.llm.context-token-budget=4000

# --- Bellavera store (see com.pm.bellavera.store.StoreProperties) ---
# mock takes no money and verifies no webhook signature; PaymentConfig refuses it under `prod`.
bellavera.store.payment-provider=mock
bellavera.store.currency=usd
# Checkout redirects are configured, never taken from the request - a client-supplied
# redirect target is an open redirect. The order id is appended to the success URL.
bellavera.store.checkout-success-url=http://localhost:5173/store/order
bellavera.store.checkout-cancel-url=http://localhost:5173/store/cart
bellavera.store.shipping-countries=US,CA
bellavera.store.max-item-quantity=20

# --- Request limits ---
# There are no uploads here, so a JSON body has no legitimate reason to be large. Spring's
# max-http-form-post-size does not cover JSON, so this is enforced by RequestSizeLimitFilter.
bellavera.http.max-request-bytes=1048576

# --- Chat limits (see com.pm.bellavera.chat.ChatProperties) ---
# A turn costs a model call, so the endpoint is rate limited per user. In-memory and therefore
# per-instance: running more than one backend multiplies the effective limit.
bellavera.chat.rate-limit-requests=20
bellavera.chat.rate-limit-window=5m

# --- CORS (comma-separated origins) ---
app.cors.allowed-origins=http://localhost:5173
